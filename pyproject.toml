[project]
name = "fiverr-mcp-server"
version = "0.1.1"
description = "MCP server for searching Fiverr gigs, sellers, and reviews"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rishabh Dogra", email = "contact@kyuish.com" }]
keywords = ["mcp", "fiverr", "freelancer", "gig", "search", "scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "curl-cffi>=0.14.0",
    "pydantic>=2.0.0",
    "fastmcp>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/KyuRish/fiverr-mcp-server"
Repository = "https://github.com/KyuRish/fiverr-mcp-server"
"Bug Tracker" = "https://github.com/KyuRish/fiverr-mcp-server/issues"

[project.scripts]
fiverr-mcp-server = "fiverr_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fiverr_mcp_server"]

